name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-util1 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xkb1 \
            libportaudio2 \
            pulseaudio

      - name: Start headless audio service
        # PortAudio initializes its host APIs even when no input stream is
        # opened. Provide a virtual audio server for the import-only checks.
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=mouser_ci

      - name: Install dependencies
        # Exercise optional voice tests without bundling these dependencies in
        # the default mouse-only application.
        run: python -m pip install -r requirements-voice.txt

      - name: Compile Python sources
        run: python -m py_compile main_qml.py core/*.py ui/*.py

      - name: Run config tests
        env:
          QT_QPA_PLATFORM: offscreen
        # Hold one QApplication for the entire suite. A test-created
        # QGuiApplication otherwise prevents later QWidget tests from running.
        run: |
          python - <<'PY'
          import unittest
          from PySide6.QtWidgets import QApplication

          app = QApplication([])
          suite = unittest.defaultTestLoader.discover("tests", pattern="test_*.py")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

      - name: Lint QML
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import PySide6

          qml_files = sorted(str(path) for path in Path("ui/qml").glob("*.qml"))
          qmllint = Path(PySide6.__file__).resolve().parent / "qmllint"
          subprocess.run([str(qmllint), *qml_files], check=True)
          PY
